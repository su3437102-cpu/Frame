<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>SpektraLab · FrameLab</title>
  <link rel="stylesheet" href="./workbench.css">
</head>
<body>
  <header class="menubar">
    <button id="back" type="button" title="返回 FrameLab" aria-label="返回 FrameLab">◉</button>
    <nav class="menus" aria-label="菜单栏">
      <details><summary>文件</summary><div class="menu">
        <button id="open-folder" type="button">打开文件夹… <kbd>Ctrl+O</kbd></button>
        <button id="open" type="button">打开图片… <kbd>Ctrl+Shift+O</kbd></button>
        <button id="open-project" type="button">打开冲洗工程…</button>
        <button id="save-project" type="button" disabled>保存冲洗工程… <kbd>Ctrl+S</kbd></button>
        <button id="menu-export" type="button" disabled>导出… <kbd>Ctrl+E</kbd></button>
      </div></details>
      <details><summary>编辑</summary><div class="menu">
        <button id="copy-settings" type="button" disabled>复制设置</button>
        <button id="paste-settings" type="button" disabled>粘贴设置 <kbd>Ctrl+Shift+V</kbd></button>
        <button id="reset-settings" type="button" disabled>重置照片设置</button>
      </div></details>
      <details><summary>视图</summary><div class="menu">
        <button data-command="toggle-left" type="button">显示／隐藏左栏 <kbd>Ctrl+B</kbd></button>
        <button data-command="toggle-browser" type="button">显示／隐藏浏览器 <kbd>F8</kbd></button>
        <button data-command="toggle-grid" type="button">图库网格 <kbd>G</kbd></button>
        <button data-command="compare" type="button">对比原图 <kbd>Y</kbd></button>
      </div></details>
      <details><summary>照片</summary><div class="menu">
        <button id="previous" type="button">上一张</button>
        <button id="next" type="button">下一张</button>
        <button data-command="crop-button" type="button">裁剪 <kbd>C</kbd></button>
      </div></details>
      <details><summary>转到</summary><div class="menu">
        <button data-command="gallery-tab" type="button">图库</button>
        <button data-command="develop-tab" type="button">冲洗</button>
        <button data-command="edit-tab" type="button">编辑</button>
      </div></details>
      <details><summary>帮助</summary><div class="menu"><a href="./source.html" target="_blank" rel="noopener">来源与许可</a></div></details>
    </nav>
    <strong>SpektraLab</strong>
    <button data-command="back" id="return" type="button">← FrameLab</button>
  </header>
  <main class="workspace">
    <aside class="rail" aria-label="冲洗与调色">
      <nav class="modes" aria-label="编辑模式">
        <button id="gallery-tab" aria-pressed="false">图库</button>
        <button id="develop-tab" aria-pressed="true">冲洗</button>
        <button id="edit-tab" aria-pressed="false">编辑</button>
      </nav>
      <section class="histogram">
        <div class="latitude">
          <label>分布 <select id="histogram-mode" aria-label="直方图模式"><option value="rgb">RGB</option><option value="exposure">输入曝光</option></select></label>
          <canvas id="exposure-meter" width="300" height="55" aria-label="输入照片曝光分布"></canvas>
          <div class="exposure-axis" aria-hidden="true"><span>−8</span><span>−4</span><span>0</span><span>+4</span><span>+8 EV</span></div>
        </div>
        <div id="stock-info"></div>
        <canvas id="histogram" width="300" height="90" aria-label="RGB 直方图"></canvas>
        <div class="zoom" aria-label="预览缩放"><button data-scale="fit" aria-pressed="true">适合</button><button data-scale="1" aria-pressed="false">100%</button><button data-scale="2" aria-pressed="false">200%</button></div>
      </section>
      <div id="develop" class="tools">
        <details open>
          <summary>胶片与相纸</summary>
          <label class="select-row">分类 <select id="category" aria-label="胶卷分类"></select></label>
          <div class="film-grid" id="film" aria-label="胶卷"></div>
          <div class="section-label">相纸 · 兼容</div>
          <div class="film-grid paper-grid" id="paper-cards" aria-label="相纸"></div>
          <input type="checkbox" id="direct" hidden>
        </details>
        <details open>
          <summary>画幅</summary>
          <div id="formats" class="format-select" aria-label="胶片画幅"></div>
          <label class="check"><input type="checkbox" id="strip-layer"> 去除防光晕层</label>
        </details>
        <details>
          <summary>片边</summary>
          <label class="select-row">画幅 <select id="border"><option value="none">关闭</option><option value="135">135 片条</option><option value="120">120 片边</option><option value="paper">相纸留白</option></select></label>
        </details>
        <details>
          <summary>日期背</summary>
          <label class="check"><input type="checkbox" id="imprint-on"> 印字</label>
          <label class="select-row">日期或文字 <input id="imprint" type="text" maxlength="32" placeholder="2026 11 26"></label>
          <label class="select-row">角落 <select id="corner"><option value="right">右下</option><option value="left">左下</option></select></label>
        </details>
      </div>
      <div id="edit" class="tools" hidden></div>
      <div id="gallery" class="tools" hidden><h2>图库</h2><button data-command="open-folder" type="button">添加文件夹…</button><button data-command="open" type="button">打开图片…</button><p>照片与冲洗设置保存在当前浏览器。可保存工程迁移到另一台设备。</p></div>
      <button id="rail-divider" class="divider" aria-label="调整左栏宽度" title="拖动调整左栏宽度"></button>
    </aside>
    <section class="viewer" aria-label="照片预览">
      <div class="toolbar">
        <div class="viewport-tools">
          <button id="toggle-left" type="button" aria-label="左栏" title="左栏 (Ctrl+B)" aria-pressed="true">◧</button>
          <button id="toggle-browser" type="button" aria-label="浏览器" title="浏览器 (F8)" aria-pressed="true">◨</button>
          <button id="toggle-grid" type="button" aria-label="网格" title="网格 (G)" aria-pressed="false">▦</button>
          <button id="crop-button" type="button" aria-label="裁剪" title="裁剪 (C)" aria-pressed="false" disabled>⌗</button>
          <select id="sort" aria-label="排序"><option value="time">导入日期</option><option value="name">文件名</option><option value="rating">评分</option></select>
          <button id="sort-direction" type="button" aria-label="切换排序方向" title="排序方向">↓</button>
        </div>
        <div class="outputs">
          <button id="compare" type="button" aria-pressed="false" disabled title="对比原图 (Y)">对比</button>
          <details id="more"><summary aria-label="更多">•••</summary><div class="menu">
            <button id="reference-button" type="button" disabled>对比 Windows 成片</button>
            <button id="publish" type="button" hidden disabled>发布回画布</button>
          </div></details>
          <button id="download" type="button" class="primary" disabled>导出</button>
        </div>
      </div>
      <div id="crop-panel" class="crop-panel" hidden>
        <label>比例 <select id="aspect"><option value="original">原始</option><option>1:1</option><option>4:5</option><option>3:2</option><option>16:9</option></select></label>
        <label>缩放 <input id="crop-zoom" aria-label="裁剪缩放" type="range" min=".3" max="1" step=".01" value="1"></label>
        <label>拉直 <input id="straighten" aria-label="拉直" type="range" min="-20" max="20" step=".1" value="0"></label>
        <button id="turn" type="button">向右旋转</button><button id="flip" type="button" aria-pressed="false">水平翻转</button>
      </div>
      <div id="stage" class="stage">
        <div id="empty">
          <button data-command="open-folder" type="button" class="primary">打开文件夹…</button>
          <button id="empty-open" type="button">打开图片…</button>
          <p>也可以将图片或文件夹拖到这里。</p>
        </div>
        <div id="gallery-grid" hidden aria-label="图库照片"></div>
        <canvas id="preview" hidden aria-label="当前照片渲染"></canvas>
        <img id="original" alt="原始照片" hidden>
        <section id="pair" class="pair" aria-label="Windows 和浏览器渲染对照" hidden>
          <figure><figcaption>Windows SpektraLab</figcaption><img id="reference" alt="Windows 版导出的照片"></figure>
          <figure><figcaption>FrameLab 浏览器版</figcaption><canvas id="reference-preview" aria-label="浏览器版成片"></canvas></figure>
        </section>
      </div>
      <div class="statusbar"><span id="status" role="status">请选择一张照片。</span><span id="backend"></span></div>
    </section>
    <aside class="photos" aria-label="照片浏览器">
      <button id="browser-divider" class="divider" aria-label="调整浏览器宽度" title="拖动调整照片浏览器宽度"></button>
      <div class="photo-count" id="count">0 张照片</div>
      <p id="photos-empty">没有照片。打开文件或文件夹，或在图库中添加照片。</p>
      <div id="photos"></div>
    </aside>
  </main>
  <dialog id="export-panel">
    <form method="dialog">
      <header><h2>导出照片</h2><button value="cancel" aria-label="关闭">×</button></header>
      <label class="select-row">规格 <select id="export-format"><option value="png">PNG · sRGB</option><option value="jpeg">JPEG · sRGB</option><option value="tiff">TIFF 8-bit · sRGB</option></select></label>
      <label class="select-row">最长边 <select id="export-size"><option value="8192">原尺寸（最多 24 MP）</option><option value="4096">4096 px</option><option value="2048" selected>2048 px</option><option value="1280">1280 px</option></select></label>
      <label class="select-row">JPEG 品质 <input id="export-quality" type="range" min="30" max="100" value="94" aria-label="JPEG 品质"></label>
      <p id="export-source"></p>
      <footer><button value="cancel">取消</button><button value="export" class="primary">导出照片</button></footer>
    </form>
  </dialog>
  <input id="files" type="file" accept=".jpg,.jpeg,.png,.webp,.tiff,.tif,.dng,.cr2,.cr3,.nef,.arw,.raf,.orf,.rw2,.pef,.raw" multiple hidden>
  <input id="folder" type="file" webkitdirectory multiple hidden>
  <input id="project-file" type="file" accept=".spektraframe" hidden>
  <input id="reference-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <script type="module" src="./workbench.mjs"></script>
</body>
</html>
